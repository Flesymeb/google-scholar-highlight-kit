<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scholar Highlight Kit</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

      <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="8" cy="8" r="6.6" fill="currentColor" opacity="0.22"/>
        <circle cx="5.7" cy="6.8" r="0.95" fill="currentColor"/>
        <circle cx="10.3" cy="6.8" r="0.95" fill="currentColor"/>
        <path d="M5.1 9.4c.9 1.25 1.85 1.85 2.9 1.85s2-.6 2.9-1.85" stroke="currentColor" stroke-width="1.15" fill="none" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div id="results" class="results" aria-live="polite"></div>
  <div class="foot-row">
    <img src="../../assets/icon128.png" alt="" class="logo" id="logo" title="Scholar Highlight Kit">

</html>
