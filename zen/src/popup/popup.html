<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scholar Highlight Kit</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <img src="../../assets/icon128.png" alt="" class="logo">
    <div class="header-text">

    <button id="github-button" class="github-icon-btn" type="button" aria-label="GitHub repository" title="GitHub repository">

      </svg>
    </button>
  </header>

  <p class="description">See your authorship roles and impact at a glance on Google Scholar profiles.</p>

  <p class="privacy-note">Core analysis stays local; limited public metadata may be checked with OpenAlex.</p>

  <footer class="footer">
    <span id="version-label">v2.4.2</span>
    <span class="footer-sep" aria-hidden="true">·</span>
    <span>Zen / Firefox port</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
